name: Build Android TV APK

# Builds an installable APK and attaches it to the workflow run.
# Download it from the run page, then upload it to Netlify next to index.html.
on:
  push:
    paths:
      - 'device-pairing/android/**'
      - '.github/workflows/build-tv-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: device-pairing/android
        run: gradle assembleDebug --no-daemon

      - name: Rename for download
        working-directory: device-pairing/android
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/streambox-tv.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: streambox-tv-apk
          path: device-pairing/android/out/streambox-tv.apk
          if-no-files-found: error
