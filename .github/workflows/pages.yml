name: Deploy device pages

# Publishes device-pairing/device/ to GitHub Pages.
# Static only — the PHP API in server/ cannot run here and needs a PHP host.
on:
  push:
    branches: [claude/chat-session-m6unp0, main]
    paths:
      - 'device-pairing/device/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload device folder
        uses: actions/upload-pages-artifact@v3
        with:
          path: device-pairing/device

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
